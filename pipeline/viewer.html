<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Level Viewer</title>
<style>
:root{--bg:#111;--fg:#eee}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px system-ui;touch-action:none}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
button{background:#0008;color:#fff;border:1px solid #fff4;border-radius:8px;padding:8px 10px;font:inherit}
#stick{position:fixed;left:24px;bottom:32px;width:110px;height:110px;border-radius:50%;background:#fff2;border:1px solid #fff4}
#info{position:fixed;bottom:8px;right:8px;opacity:.7;text-shadow:0 1px 2px #000}
#stats{position:fixed;top:96px;left:8px;background:#000a;padding:6px 8px;border-radius:8px;font:12px ui-monospace,monospace;white-space:pre;pointer-events:none}
#vert{position:fixed;right:16px;bottom:40px;display:flex;flex-direction:column;gap:10px}
#vert button{width:56px;height:56px;font-size:20px}
#jumpb{position:fixed;right:20px;bottom:44px;width:72px;height:72px;border-radius:50%}
#sel li{margin:4px 0;list-style:none}#sel ul{padding:0;margin:6px 0}#sel .sev-error{color:#ff7a6a}#sel .sev-warning{color:#ffc04d}#sel .sev-info{color:#8fc3ff}
#sel{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:46%;overflow:auto;background:#101418ee;border:1px solid #fff3;border-radius:12px;padding:10px 12px;font:13px system-ui;line-height:1.45}
#sel h3{margin:0 0 4px;font:600 15px system-ui;word-break:break-all}#sel .row{display:flex;gap:10px;align-items:flex-start}#sel .k{opacity:.6}
#sel canvas{width:64px;height:64px;border-radius:6px;flex:none;border:1px solid #fff3}#sel .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#sel .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;border:1px solid #fff5}
#shot{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#shot img{max-width:100%;max-height:78%;border:1px solid #fff4;border-radius:8px}#shot p{margin:0;opacity:.8;text-align:center}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><button id="mode">View: 3rd person</button><button id="q">Quality: med</button><button id="fx" hidden>FX</button><button id="statsb">Stats</button><button id="shotb">📷</button><button id="reset">Respawn</button><button id="issb" hidden>⚠</button></div>
<div id="stick"></div><div id="info"></div><div id="stats" hidden></div>
<div id="vert" hidden><button id="upb">▲</button><button id="dnb">▼</button></div><button id="jumpb" hidden>Jump</button>
<div id="sel" hidden></div><div id="shot" hidden><img id="shotimg" alt="Screenshot of the current view"><p>Press and hold the image to save or share it.</p><button id="shotclose">Close</button></div>

window.lookFrom=(px,py,pz,tx,ty,tz,fov=60)=>{orbit.enabled=false;fixedCam={p:new THREE.Vector3(px,py,pz),t:new THREE.Vector3(tx,ty,tz)};cam.fov=fov;cam.updateProjectionMatrix();
  $('stick').hidden=true;$('vert').hidden=true;$('jumpb').hidden=true;$('mode').textContent='View: inspect';};
$('jumpb').onpointerdown=()=>{jumpReq=true;};addEventListener('keydown',e=>{if(e.code==='Space')jumpReq=true;});$('mode').onclick=()=>setMode((mode+1)%MODES.length);
$('info').textContent=(window.TRIS_LABEL||meta.triangles+' tris')+(env?' · '+env.sky.preset+' · '+env.quality:'')+(window.BUILD_ID?' · '+window.BUILD_ID:'');
// quality: render resolution (+ effects level when the level has effects); remembered per device
const QL=[['low',1,'performance'],['med',1.5,'balanced'],['high',2,'quality']];let ql=1;try{ql=+(localStorage.getItem('lvq')??1);}catch(e){}

  if(FXD&&FXQ[fxq]!=='off'&&window.setFX)window.setFX(fxn);try{localStorage.setItem('lvq',i);}catch(e){}}

// stats (measured in THIS browser via three.js - not a Godot/device benchmark)

// tap to identify: name, type, size, position, material (+ texture), for the dev AND merged mobile builds
const pickRoots=[gltf.scene].concat(bg?[bg.scene]:[]);const objSpec={};for(const o of meta.objects||[])objSpec[o.name]=o;
const selBox=new THREE.Box3Helper(new THREE.Box3(),0xffdd33);selBox.visible=false;scene.add(selBox);
const fmt=v=>Array.isArray(v)?'['+v.map(x=>+(+x).toFixed(2)).join(', ')+']':v;
function texThumb(m){const c=document.createElement('canvas');c.width=c.height=64;const img=m&&m.map&&m.map.image;
  try{if(img)c.getContext('2d').drawImage(img,0,0,64,64);else{const g=c.getContext('2d');g.fillStyle=m&&m.color?'#'+m.color.getHexString():'#555';g.fillRect(0,0,64,64);}}catch(e){}return c;}
function pick(cx,cy){const nd=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1),rc=new THREE.Raycaster();rc.setFromCamera(nd,cam);
  const hits=rc.intersectObjects(pickRoots,true).filter(h=>h.object.visible&&h.object.material&&h.object.material.visible!==false&&!(h.object.name||'').startsWith('Spawn'));
  if(!hits.length){$('sel').hidden=true;selBox.visible=false;return;}

  if(ud.source_objects&&ud.source_objects.length>1){merged=o.name;name=ud.source_objects[0];let best=1e9;           // merged mobile node: which source object was hit?
    for(const [n,b] of Object.entries(ud.source_bounds||{})){const bb=new THREE.Box3(new THREE.Vector3(b[0],b[1],b[2]),new THREE.Vector3(b[3],b[4],b[5]));

  const m=o.material,md=(meta.materials||{})[(sp&&sp.material)||(m.name||'').replace(/__2s$/,'')]||{};

  const rows=[];const add=(k,v)=>{if(v!==undefined&&v!==null&&v!=='')rows.push(`<div><span class="k">${k}</span> ${v}</div>`);};
  if(sp){add('type',sp.type);add('parent',sp.parent);add('position',fmt(sp.position));add('size',fmt(sp.size));if(sp.rotation&&sp.rotation.some(v=>v))add('rotation',fmt(sp.rotation));}
  else if(bgl){add('background layer',bgl.id+' ('+bgl.type+')');add('triangles',bgl.triangles);}
  else if(isTer(name)||/^(SC|SCN|TW)_/.test(name))terrainInfo(name,h,add);
  if(merged)add('merged into',merged+' (mobile build)');
  const col=md.color?`<span class="sw" style="background:rgb(${md.color.map(c=>Math.round(c*255)).join(',')})"></span> `:'';
  add('material',col+(m.name||'?')+(md.type?' · '+md.type:'')+(md.tile_m?' · tile '+md.tile_m+' m':'')+(md.emissive?' · glows':'')+(md.bevel?' · bevel '+md.bevel:''));
  add('hit at',fmt(h.point.toArray()));add('triangles in mesh',o.geometry.index?o.geometry.index.count/3:o.geometry.attributes.position.count/3);
  const hint=`In ${document.title}: object "${base}"`+(sp?` (${sp.type}, material ${sp.material}, position ${fmt(sp.position)}, size ${fmt(sp.size)})`:bgl?` (background layer ${bgl.id}, ${bgl.type})`:'')+'. Please change: ';
  const el=$('sel');el.innerHTML=`<h3>${base}</h3><div class="row"><div></div><div>${rows.join('')}</div></div><div class="btns"><button id="copyb">Copy for Claude</button><button id="selclose">Close</button></div>`;
  el.querySelector('.row').replaceChild(texThumb(m),el.querySelector('.row div'));el.hidden=false;
  $('selclose').onclick=()=>{el.hidden=true;selBox.visible=false;};
  $('copyb').onclick=()=>{const done=()=>{$('copyb').textContent='Copied';};
    navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(hint).then(done,()=>fallback()):fallback();
    function fallback(){const t=document.createElement('textarea');t.value=hint;el.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){$('copyb').textContent='Select & copy below';}}};}
window.pickAt=pick;
// Stage 9: terrain region selection - chunk / zone, slope, height, which named features (level.json terrain) cover the point
function terrainInfo(name,h,add){const T=meta.terrain||{},p=h.point,n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):null;
  const zone=name.startsWith('TRM_')?'middle zone (scenery, not playable)':name.startsWith('TW_')?'water surface':name.startsWith('SC')?'scatter (instanced props)':'near terrain (playable)';
  add('zone',zone);const m=name.match(/^TR_(\d+)_(\d+)/);if(m)add('chunk',`TR_${m[1]}_${m[2]}`+(/_L(\d)/.test(name)?' · LOD '+name.match(/_L(\d)/)[1]:''));
  if(n)add('slope',Math.round(Math.acos(Math.min(1,Math.abs(n.y)))*180/Math.PI)+'° (walkable ≤ '+GP.player.max_slope_deg+'°)');
  const inBox=(f,pad)=>{if(f.center){const r=(f.radius||Math.max(...(f.size||[8,8]))/2)*Math.max(...(f.stretch||[1,1]))+pad;return Math.hypot(p.x-f.center[0],p.z-f.center[1])<=r;}
    if(f.points){let best=1e9;for(let i=0;i<f.points.length-1;i++){const a=f.points[i],b=f.points[i+1],dx=b[0]-a[0],dz=b[1]-a[1],L2=dx*dx+dz*dz||1;
      const t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.z-a[1])*dz)/L2));best=Math.min(best,Math.hypot(p.x-a[0]-t*dx,p.z-a[1]-t*dz));}return best<=(f.width||20)/2+pad;}
    if(f.area)return p.x>=f.area[0]&&p.x<=f.area[2]&&p.z>=f.area[1]&&p.z<=f.area[3];return false;};
  const fs=(T.features||[]).filter(f=>f.type!=='barrier'&&inBox(f,2)).map(f=>f.id+' ('+f.type+')');add('features here',fs.join(', ')||'base terrain (noise)');
  if(T.biome)add('biome',T.biome);if(T.seed!==undefined)add('seed',T.seed);}
// top-down map overlay: playable boundary (red), player (blue) / enemy (orange) spawn regions
let mapG=null;{const T=meta.terrain||{},B=(T.boundary||{}).points,R=meta.spawn_regions||[];
  if(B||R.length){mapG=new THREE.Group();const ray2=new THREE.Raycaster(),hy=(x,z)=>{ray2.set(new THREE.Vector3(x,500,z),new THREE.Vector3(0,-1,0));const q=ray2.intersectObjects(solids)[0];return q?q.point.y+0.6:0;};
    const loop=(pts,col)=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(([x,z])=>new THREE.Vector3(x,hy(x,z),z)));const l=new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:col,depthTest:false}));l.renderOrder=5;mapG.add(l);};
    if(B){const dense=[];for(let i=0;i<B.length;i++){const a=B[i],b=B[(i+1)%B.length];for(let k=0;k<6;k++)dense.push([a[0]+(b[0]-a[0])*k/6,a[1]+(b[1]-a[1])*k/6]);}loop(dense,0xff3333);}
    for(const r of R){const c=[];for(let k=0;k<24;k++){const a=k/24*Math.PI*2;c.push([r.center[0]+Math.cos(a)*r.radius,r.center[1]+Math.sin(a)*r.radius]);}loop(c,r.team==='enemy'?0xff9922:0x3399ff);}
    mapG.visible=false;scene.add(mapG);}}
// Stage 7: validation issues (window.ISSUES from checks/report.json): markers in the scene + a list; tap an item to look at it
const ISS=window.ISSUES||[];let issG=null;
if(ISS.length){const b=$('issb');b.hidden=false;b.textContent='⚠ '+ISS.length;
  b.onclick=()=>{if(issG){scene.remove(issG);issG=null;$('sel').hidden=true;return;}issG=new THREE.Group();
    const col={error:0xff4433,warning:0xffaa22,info:0x55aaff};
    ISS.forEach(it=>{if(!it.pos)return;const m=new THREE.Mesh(new THREE.SphereGeometry(.6,10,8),new THREE.MeshBasicMaterial({color:col[it.severity]||0xffffff,depthTest:false,transparent:true,opacity:.85}));
      m.position.set(...it.pos);m.position.y+=1.2;m.renderOrder=9;issG.add(m);
      const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...it.pos),m.position.clone()]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col[it.severity]||0xffffff,depthTest:false}));l.renderOrder=9;issG.add(l);});
    scene.add(issG);const el=$('sel');
    el.innerHTML='<h3>Validation issues</h3><ul>'+ISS.map((it,i)=>`<li class="sev-${it.severity}"><button data-i="${i}">Look</button> ${it.severity}: ${it.message}</li>`).join('')+'</ul><div class="btns"><button id="isscopy">Copy for Claude</button><button id="issclose">Close</button></div>';
    el.hidden=false;el.querySelectorAll('button[data-i]').forEach(bt=>bt.onclick=()=>{const it=ISS[+bt.dataset.i];if(!it.pos)return;const p=it.pos;window.lookFrom(p[0]+9,p[1]+8,p[2]+9,p[0],p[1],p[2]);});
    $('issclose').onclick=()=>{el.hidden=true;};
    $('isscopy').onclick=()=>{const t=`In ${document.title}: please fix these validation issues: `+ISS.map(i=>i.message).join(' | ');try{navigator.clipboard.writeText(t).then(()=>$('isscopy').textContent='Copied');}catch(e){}};};}
// input: stick = move (walk / fly), drag = look, tap = identify; WASD + mouse on desktop
const keys={};onkeydown=e=>keys[e.code]=1;onkeyup=e=>keys[e.code]=0;
const mv={x:0,y:0},stick=$('stick');let sid=null,lid=null,lx=0,ly=0,tap=null,vert=0;
const onUI=e=>e.target.closest&&e.target.closest('button,#sel,#shot');window.render1=()=>r.render(scene,cam);
$('upb').onpointerdown=()=>vert=1;$('dnb').onpointerdown=()=>vert=-1;$('upb').onpointerup=$('dnb').onpointerup=$('upb').onpointerleave=$('dnb').onpointerleave=()=>vert=0;
addEventListener('pointerdown',e=>{if(onUI(e))return;tap={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId};
  if(orbit.enabled)return;const b=stick.getBoundingClientRect();
  if(!stick.hidden&&e.clientX<b.right+20&&e.clientY>b.top-20&&sid===null)sid=e.pointerId;else{lid=e.pointerId;lx=e.clientX;ly=e.clientY;}});
addEventListener('pointermove',e=>{if(e.pointerId===sid){const b=stick.getBoundingClientRect();
  mv.x=Math.max(-1,Math.min(1,(e.clientX-b.left-b.width/2)/50));mv.y=Math.max(-1,Math.min(1,(e.clientY-b.top-b.height/2)/50));}
  else if(e.pointerId===lid){yaw-=(e.clientX-lx)*0.005;pitch=Math.max(-1.3,Math.min(1.2,pitch-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;}});

  if(tap&&tap.id===e.pointerId&&e.pointerId!==sid&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8&&performance.now()-tap.t<350&&!onUI(e))pick(e.clientX,e.clientY);tap=null;});
const ray=new THREE.Raycaster(),down=new THREE.Vector3(0,-1,0),UP=new THREE.Vector3(0,1,0);let last=performance.now();
function blocked(dir,dist){ray.set(new THREE.Vector3(pos.x,pos.y-meta.eye_height+0.5,pos.z),dir);ray.far=dist+0.3;return ray.intersectObjects(solids).length>0;}
setMode(0);
r.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,0.05);fpsS=fpsS*0.95+(1/Math.max((now-last)/1000,1e-3))*0.05;last=now;
  const M=MODES[mode];if(ranged.length)applyRanges(cam.position);if(mapG)mapG.visible=M==='top-down'||M==='free cam';
  if(fixedCam){avatar.visible=false;cam.position.copy(fixedCam.p);cam.lookAt(fixedCam.t);}
  else if(walking()){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x;
    const d=new THREE.Vector3(s,0,-f);if(d.lengthSq()>0){d.normalize().applyAxisAngle(UP,yaw);const step=GP.player.walk_speed*dt;if(!blocked(d,step))pos.addScaledVector(d,step);}
    ray.set(new THREE.Vector3(pos.x,pos.y+0.5,pos.z),down);ray.far=100;const h=ray.intersectObjects(solids)[0];
    const ground=h?h.point.y:-50;if(h&&h.object.name.startsWith('Hazard')&&pos.y-meta.eye_height<h.point.y+0.3){spawn();}if(jumpReq&&pos.y<=ground+meta.eye_height+0.05)vy=Math.sqrt(2*GP.player.gravity*GP.player.jump_height);jumpReq=false;vy-=GP.player.gravity*dt;pos.y+=vy*dt;
    if(pos.y<ground+meta.eye_height){pos.y=ground+meta.eye_height;vy=0;}if(pos.y<-40)spawn();
    avatar.position.set(pos.x,pos.y-meta.eye_height+GP.player.height/2,pos.z);avatar.visible=M==='3rd person';
    if(M==='1st person'){cam.position.copy(pos);cam.rotation.set(pitch,yaw,0,'YXZ');}
    else{ // 3rd person: camera orbits 5 m from the player's head, pulled in when a wall is in the way
      const C=GP.camera,pr=C.probe_radius,head=new THREE.Vector3(pos.x,pos.y+C.pivot_above_eye,pos.z),back=new THREE.Vector3(0,0,1).applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
      let dist=C.arm_length;const side=new THREE.Vector3().crossVectors(back,UP).normalize(),up2=new THREE.Vector3().crossVectors(side,back);
      for(const o of [[0,0],[pr,0],[-pr,0],[0,pr],[0,-pr]]){ // spring arm with a probe radius (5 rays): never past or grazing a wall
        ray.set(head.clone().addScaledVector(side,o[0]).addScaledVector(up2,o[1]),back);ray.far=C.arm_length;const hit=ray.intersectObjects(camSolids)[0];
        if(hit)dist=Math.min(dist,hit.distance>2*C.margin?hit.distance-C.margin:hit.distance*0.5);}

  }else if(M==='free cam'){avatar.visible=true;const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));

    fpos.addScaledVector(new THREE.Vector3(s,0,-f).applyQuaternion(q),12*dt).addScaledVector(UP,8*u*dt);cam.position.copy(fpos);cam.quaternion.copy(q);
